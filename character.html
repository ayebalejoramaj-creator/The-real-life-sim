<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Reality World — Character Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen studio. Stage (3D view) on top, options sheet below on phones; sheet left, stage right on wide screens. */
:root{
  color-scheme: dark;
  --bg:#101319;
  --panel:#171b23;
  --panel2:#202632;
  --line:#2c3441;
  --fg:#eef0f4;
  --muted:#9aa4b4;
  --accent:#ffb347;
  --accent-ink:#2a1a00;
  --head:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font:700 17px/1 var(--head);margin:0;letter-spacing:.2px;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;font:500 13px var(--body);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:8px 12px;border-radius:10px;font:500 13px var(--body);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 30%,#2d3646 0%,#161a22 70%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
.sheet{height:clamp(250px,44%,420px);display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line)}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
nav button{border:0;background:transparent;color:var(--muted);padding:12px 12px;font:600 13px var(--body);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
#panel{overflow-y:auto;padding:6px 14px 18px;flex:1;min-height:0}
.grp{padding:10px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 9px;font:600 12px var(--body);letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:8px 11px;border-radius:10px;font:500 13px var(--body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;margin:4px 0}
.row label{width:96px;color:var(--fg);flex:none}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.anims{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
input[type=text],textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px var(--body)}
textarea{min-height:76px;resize:vertical;font:12px ui-monospace,monospace}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:860px){
  .app{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:1 / -1}
  .sheet{grid-column:1;grid-row:2;height:auto;border-top:0;border-right:1px solid var(--line)}
  .stage{grid-column:2;grid-row:2}
}
</style>

<div class="app">
  <header>
    <h1>Reality World · Character Studio</h1>
    <div class="seg" id="gender" role="group" aria-label="Gender">
      <button data-g="female">Female</button><button data-g="male">Male</button>
    </div>
    <button class="btn" id="dice" aria-label="Randomise character">Randomise</button>
    <button class="btn" id="view" aria-label="Change camera view">View: Full</button>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint">Drag to turn. Pinch or scroll to zoom.</div>
  </main>
  <section class="sheet">
    <nav id="tabs" aria-label="Customisation sections"></nav>
    <div id="panel"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================= DATA ================= */
var SKIN=['#f3d2b8','#e9b894','#d9a47c','#c58b62','#a56a45','#7a4a2e','#573220','#3b2418'];
var HAIR_COL=['#0f0c0b','#2b1d15','#4a3020','#7a4f2a','#b07a3c','#d9b46a','#a3261f','#7d7f86','#e8e4dc','#3b5bdb','#c2398a'];
var EYE_COL=['#3b2a1e','#6b4423','#3f6b8f','#4f7a4a','#6f6f76','#1a1a1a'];
var TOP_COL=['#f1ece1','#23262d','#3c5aa6','#a8322d','#2f7a5a','#d9a441','#6b4aa8','#7d848c','#e08a9b','#c46a2b'];
var BOT_COL=['#2f4a73','#1d2c47','#6b88b3','#23252b','#8a6f4d','#e7e3da','#a8322d','#2f7a5a'];
var SHOE_COL=['#f1f1f3','#16161a','#8a5a33','#a8322d','#3c5aa6'];
var ACC_COL=['#d9b25f','#c9ccd1','#23262d','#a8322d','#3c5aa6','#2f7a5a'];

var HAIRS=[['bald','Bald'],['buzz','Buzz cut'],['short','Short'],['quiff','Quiff'],['afro','Afro'],['curly','Long curls'],['long','Long straight'],['bob','Bob'],['ponytail','Ponytail'],['bun','Bun'],['twinbuns','Twin buns'],['braids','Braids']];
var FACIAL=[['none','Clean'],['stubble','Stubble'],['moustache','Moustache'],['goatee','Goatee'],['beard','Full beard']];
var BROWS=[['thin','Thin'],['natural','Natural'],['thick','Thick']];
var TOPS=[['tee','T-shirt'],['tank','Tank top'],['long','Long sleeve'],['hoodie','Hoodie'],['jacket','Denim jacket'],['blazer','Blazer'],['dress','Sundress']];
var BOTTOMS=[['jeans','Jeans'],['shorts','Shorts'],['joggers','Joggers'],['cargo','Cargo pants'],['trousers','Trousers'],['skirt','Skirt']];
var SHOES=[['sneakers','Sneakers'],['boots','Boots'],['sandals','Sandals'],['formal','Formal']];
var ACCS=[['glasses','Glasses'],['shades','Sunglasses'],['cap','Cap'],['beanie','Beanie'],['headphones','Headphones'],['earrings','Earrings'],['necklace','Necklace'],['scarf','Scarf'],['watch','Watch'],['backpack','Backpack']];
var ACC_CONFLICT={glasses:'shades',shades:'glasses',cap:'beanie',beanie:'cap'};

var DEFAULT={gender:'female',name:'',height:.5,build:.34,bodyType:'stocky',face:.5,nose:.5,skin:SKIN[2],eye:EYE_COL[0],brow:'natural',freckles:false,facial:'none',
  hair:'curly',hairCol:HAIR_COL[0],top:'hoodie',topCol:TOP_COL[0],bottom:'cargo',bottomCol:BOT_COL[0],shoe:'sneakers',shoeCol:SHOE_COL[0],acc:{},accCol:ACC_COL[0]};
var state=JSON.parse(JSON.stringify(DEFAULT));

/* ================= HELPERS ================= */
var DS=THREE.DoubleSide;
function mat(c,o){var p={color:c,roughness:.7,metalness:0,side:DS};if(o)for(var k in o)p[k]=o[k];return new THREE.MeshStandardMaterial(p);}
function mesh(geo,m,p,s,r){var x=new THREE.Mesh(geo,m);if(p)x.position.set(p[0],p[1],p[2]);if(s)x.scale.set(s[0],s[1],s[2]);if(r)x.rotation.set(r[0],r[1],r[2]);x.castShadow=true;return x;}
var UNIT=new THREE.SphereGeometry(1,16,12);UNIT.userData.shared=true;
function sph(r,m,p,s,rot){return mesh(UNIT,m,p,s?[r*s[0],r*s[1],r*s[2]]:[r,r,r],rot);}
function box(w,h,d,m,p,rot){return mesh(new THREE.BoxGeometry(w,h,d),m,p,null,rot);}
function cap(r,len,m,p,rot){return mesh(new THREE.CapsuleGeometry(r,Math.max(.001,len),6,12),m,p,null,rot);}
function tor(r,t,m,p,rot,arc){return mesh(new THREE.TorusGeometry(r,t,10,32,arc||Math.PI*2),m,p,null,rot);}
function shade(hex,a){var c=new THREE.Color(hex);c.offsetHSL(0,0,a);return '#'+c.getHexString();}
function mix(a,b,t){return '#'+new THREE.Color(a).lerp(new THREE.Color(b),t).getHexString();}
function clamp01(x){return Math.max(0,Math.min(1,x));}
function rngMaker(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function bone(parent,x,y,z){var g=new THREE.Group();g.position.set(x||0,y||0,z||0);parent.add(g);return g;}

/* ================= CHARACTER BUILD ================= */
var rig=null;

function disposeTree(o){o.traverse(function(n){if(n.geometry&&!n.geometry.userData.shared)n.geometry.dispose();if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){m.dispose();});}});}

function lathe(pts,m,dz){
  var g=new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),28);
  var me=new THREE.Mesh(g,m);me.scale.z=dz;me.castShadow=true;return me;
}

/* limb piece covering `frac` of a segment, from top (or from bottom) */
function limbCloth(parent,r,len,frac,m,fromBottom){
  var l=len*frac;if(l<=0)return;
  var me=cap(r,l-2*r,m);
  me.position.y=fromBottom?-(len-l/2):-l/2;
  parent.add(me);
}

function build(){
  if(rig){rig.root.parent&&rig.root.parent.remove(rig.root);disposeTree(rig.root);}
  var s=state,male=s.gender==='male';
  var H=(male?1.78:1.66)*(0.92+0.16*s.height);
  var bw=0.76+0.56*s.build;
  var skin=mat(s.skin,{roughness:.55});
  var topM=mat(s.topCol,{roughness:.9}),botM=mat(s.bottomCol,{roughness:.85}),shoeM=mat(s.shoeCol,{roughness:.55});
  var accM=mat(s.accCol,{roughness:.35,metalness:.35});
  var hairM=mat(s.hairCol,{roughness:.5,metalness:.05});

  var root=new THREE.Group();
  var B={}; /* named bones */

  /* proportions (metres) */
  var cR=H*(male?.108:.09)*bw, wR=H*(male?.092:.077)*bw, hR=H*(male?.098:.106)*bw, dz=male?.78:.76;
  var armR=H*(male?.0285:.0235)*bw, legR=H*.046*(.9+.1*bw);
  var hipsY=.55*H;

  /* ---- hips / pelvis ---- */
  B.hips=bone(root,0,hipsY,0);
  var pelvisPts=function(k){return [[0,-.085*H],[hR*.55*k,-.08*H],[hR*.92*k,-.045*H],[hR*k,0],[hR*.97*k,.045*H],[wR*1.02*k,.10*H],[wR*k*.9,.115*H]];};
  B.hips.add(lathe(pelvisPts(1),skin,dz));
  var dress=s.top==='dress';
  if(!dress && s.bottom!=='skirt'){ /* trousers/shorts waist layer */
    B.hips.add(lathe(pelvisPts(1.05),botM,dz));
  }
  if(dress){B.hips.add(lathe(pelvisPts(1.05),topM,dz));}
  if(s.bottom==='skirt'&&!dress){B.hips.add(lathe(pelvisPts(1.05),botM,dz));}
  if((s.bottom==='trousers'||s.bottom==='jeans'||s.bottom==='cargo')&&!dress){var belt=tor(wR*1.06,.005*H,mat('#3b2a1e',{roughness:.5}),[0,.085*H,0],[Math.PI/2,0,0]);belt.scale.set(1,dz,1);B.hips.add(belt);}

  /* skirt / dress flare */
  var skirtHem=dress?-.34*H:(s.bottom==='skirt'?-.22*H:0), skirtM=dress?topM:botM;
  if(skirtHem<0){
    B.hips.add(lathe([[hR*1.55*(skirtHem<-.3*H?1.25:1),skirtHem],[hR*1.38,skirtHem*.55],[hR*1.1,-.04*H],[wR*1.06,.09*H],[wR*.9,.1*H]],skirtM,.9));
  }

  B.spine=bone(B.hips,0,.09*H,0);
  B.chest=bone(B.spine,0,.09*H,0);
  var torsoG=bone(B.chest,0,0,0); /* breathing scales this group */

  var upper=function(k,hemY){ /* hemY: lowest y relative to chest */
    var t=clamp01((-.08*H-hemY)/(.09*H));
    var hemR=k*(wR+(hR-wR)*t);
    var p=[[hemR*.98,hemY],[hemR,hemY+.004*H]];
    var prof=[[wR,-.08*H],[wR*1.03,-.04*H],[cR*.95,0],[cR,.05*H],[cR*.96,.095*H],[cR*.7,.125*H],[H*.03,.14*H],[0,.145*H]];
    for(var i=0;i<prof.length;i++){if(prof[i][1]>hemY+.004*H)p.push([i>=6?prof[i][0]:prof[i][0]*k,prof[i][1]]);}
    return p;
  };
  torsoG.add(lathe(upper(1,-.08*H),skin,dz));

  var topK={tee:1.06,tank:1.045,long:1.06,hoodie:1.12,jacket:1.1,blazer:1.1,dress:1.05}[s.top];
  var topHem={tee:-.12,tank:-.1,long:-.13,hoodie:-.2,jacket:-.17,blazer:-.24,dress:-.07}[s.top]*H;
  torsoG.add(lathe(upper(topK,topHem),topM,dz));
  var zf=cR*dz*topK+.003; /* front surface of top */

  if(male===false){ /* bust */
    var bustS=sph(.045*H,skin,[.043*H*bw,.035*H,cR*dz*.8],[1,1,.9]);torsoG.add(bustS);
    var bustS2=sph(.045*H,skin,[-.043*H*bw,.035*H,cR*dz*.8],[1,1,.9]);torsoG.add(bustS2);
    var bk=topK>1.08?1.14:1.1;
    torsoG.add(sph(.045*H*bk,topM,[.043*H*bw,.035*H,cR*dz*.8],[1,1,.92]));
    torsoG.add(sph(.045*H*bk,topM,[-.043*H*bw,.035*H,cR*dz*.8],[1,1,.92]));
  }
  var dark=shade(s.topCol,-.1);
  if(s.top==='hoodie'){
    torsoG.add(sph(.062*H,topM,[0,.118*H,-.04*H],[1.15,.7,.95]));
    torsoG.add(box(.1*H,.045*H,.012*H,mat(dark,{roughness:.9}),[0,-.05*H,zf]));
    torsoG.add(cap(.004*H,.07*H,mat('#efe9dc'),[.014*H,.065*H,zf+.003]));
    torsoG.add(cap(.004*H,.07*H,mat('#efe9dc'),[-.014*H,.065*H,zf+.003]));
  }
  if(s.top==='jacket'){
    torsoG.add(box(.034*H,.034*H,.01*H,mat(dark,{roughness:.9}),[.045*H,.06*H,zf]));
    torsoG.add(box(.034*H,.034*H,.01*H,mat(dark,{roughness:.9}),[-.045*H,.06*H,zf]));
    torsoG.add(box(.006*H,.2*H,.008*H,mat(dark,{roughness:.9}),[0,0,zf]));
  }
  if(s.top==='blazer'){
    var lap=mat(shade(s.topCol,-.07),{roughness:.8});
    torsoG.add(box(.03*H,.11*H,.008*H,mat('#f3f1ec'),[0,.065*H,zf+.001]));
    torsoG.add(box(.016*H,.12*H,.01*H,lap,[.026*H,.06*H,zf+.004],[0,0,.32]));
    torsoG.add(box(.016*H,.12*H,.01*H,lap,[-.026*H,.06*H,zf+.004],[0,0,-.32]));
  }

  /* ---- neck / head ---- */
  B.neck=bone(B.chest,0,.11*H,0);
  var neckR=H*(male?.03:.025);
  B.neck.add(mesh(new THREE.CylinderGeometry(neckR,neckR*1.08,.07*H,16),skin,[0,.015*H,0]));
  if(s.top==='blazer'||s.top==='jacket'){B.neck.add(tor(neckR*1.15,.007*H,mat(s.top==='blazer'?'#f3f1ec':s.topCol,{roughness:.85}),[0,.0,0],[Math.PI/2,0,0]));}
  B.head=bone(B.neck,0,.045*H,0);

  var R=.0625*H, sx=.88+.16*s.face;
  var headU=bone(B.head,0,.066*H,0); /* unit-space head: radius 1 == R */
  headU.scale.set(R*sx,R*1.08,R*.98);
  headU.add(sph(1,skin,[0,0,0]));
  headU.add(sph(.78,skin,[0,-.42,.13],[male?1.0:.86,.9,.9])); /* jaw/chin */
  headU.add(sph(.18,skin,[.97,0,-.05],[.35,1,.7]));
  headU.add(sph(.18,skin,[-.97,0,-.05],[.35,1,.7]));

  /* eyes */
  var irisM=mat(s.eye,{roughness:.25}),white=mat('#f4f2ee',{roughness:.2}),pupil=mat('#050505',{roughness:.2}),lashM=mat('#1a1410');
  [['lEye',1],['rEye',-1]].forEach(function(e){
    var g=bone(headU,e[1]*.40,.10,.90);
    g.add(sph(.15,white,[0,0,0],[1,1,.55]));
    g.add(sph(.095,irisM,[0,0,.06],[1,1,.45]));
    g.add(sph(.05,pupil,[0,0,.095],[1,1,.4]));
    g.add(cap(male?.016:.022,.24,lashM,[0,.135,.04],[0,0,Math.PI/2]));
    B[e[0]]=g;
  });
  /* brows */
  var browC=shade(s.hairCol,-.04), bt={thin:.022,natural:.032,thick:.05}[s.brow];
  [[1,-1],[-1,1]].forEach(function(b){
    headU.add(cap(bt,.34,mat(browC,{roughness:.8}),[b[0]*.40,.36,.85],[0,0,Math.PI/2+b[0]*.16]));
  });
  /* nose & mouth */
  var nz=.7+.6*s.nose;
  headU.add(sph(.13*nz,skin,[0,-.12,.97],[.9,1.1,1]));
  headU.add(sph(.09*nz,skin,[.07*nz,-.17,.94],[.9,.8,.9]));
  headU.add(sph(.09*nz,skin,[-.07*nz,-.17,.94],[.9,.8,.9]));
  var lipC=mix(s.skin,'#a8454f',male?.35:.5), lipM=mat(lipC,{roughness:.35});
  headU.add(sph(.17,lipM,[0,-.45,.88],[1.5,male?.24:.3,.35]));
  headU.add(sph(.15,lipM,[0,-.52,.87],[1.4,male?.26:.34,.38]));
  /* freckles */
  if(s.freckles){
    var fr=rngMaker(7),fm=mat(shade(s.skin,-.14),{roughness:.8});
    for(var i=0;i<26;i++){
      var side=i%2?1:-1,fx=side*(.1+fr()*.42),fy=-.2+fr()*.28;
      var fz=Math.sqrt(Math.max(.05,1-fx*fx-fy*fy))+.005;
      headU.add(sph(.022,fm,[fx,fy,fz]));
    }
  }

  /* ---- hair ---- */
  function shell(r,ph0,phL,th0,thL,m){return mesh(new THREE.SphereGeometry(r,30,18,ph0,phL,th0,thL),m||hairM);}
  function ball(g,r,x,y,z,a,b,c){g.add(sph(r,hairM,[x,y,z],[a||1,b||1,c||1]));}
  var PI=Math.PI;
  function makeHair(style){
    var g=new THREE.Group(),r=rngMaker(11);
    function top(rad,th){g.add(shell(rad,0,PI*2,0,th));}
    function back(rad,gap,t0,t1){g.add(shell(rad,PI/2+gap,PI*2-2*gap,t0,t1-t0));}
    switch(style){
      case 'buzz':top(1.03,1.05);back(1.03,1.05,.95,1.55);break;
      case 'short':top(1.08,1.15);back(1.08,.95,1.0,1.75);ball(g,.4,0,.78,.72,1.4,.45,.6);break;
      case 'quiff':top(1.08,1.15);back(1.08,.95,1.0,1.75);ball(g,.55,0,1.05,.4,1.1,.8,1.4);break;
      case 'afro':
        var ag=new THREE.Group();ag.position.y=.25;
        ag.add(shell(1.42,0,PI*2,0,1.15));ag.add(shell(1.42,PI/2+.75,PI*2-1.5,1.15,1.4));g.add(ag);break;
      case 'curly':
        top(1.12,1.2);back(1.1,.9,1.1,2.0);
        for(var i=0;i<70;i++){var th=.2+r()*2.0,ph=PI/2+.8+r()*(PI*2-1.6),rr=1.17;
          ball(g,.2+r()*.08,-rr*Math.cos(ph)*Math.sin(th),rr*Math.cos(th),rr*Math.sin(ph)*Math.sin(th));}
        for(var j=0;j<34;j++){ball(g,.22+r()*.06,(r()-.5)*1.9,.1-r()*2.6,-.55-r()*.4);}

/* ================= ANIMATION ================= */
var REST={hips:[0,0,0],spine:[0,0,0],chest:[0,0,0],neck:[0,0,0],head:[0,0,0],
  lArm:[0,0,.07],rArm:[0,0,-.07],lFore:[-.12,0,0],rFore:[-.12,0,0],
  lThigh:[0,0,.02],rThigh:[0,0,-.02],lCalf:[.03,0,0],rCalf:[.03,0,0],lFoot:[0,0,0],rFoot:[0,0,0],lEye:[0,0,0],rEye:[0,0,0]};
var cur={dy:0};for(var k in REST)cur[k]=REST[k].slice();
var S=Math.sin,C=Math.cos,ABS=Math.abs,PI=Math.PI;

var ANIMS={
  idle:{label:'Idle',f:function(){return {};}},
  walk:{label:'Walk',f:function(t,H){var w=2*PI/1.1*t,s=S(w);return {
    lThigh:[-.55*s,0,0],rThigh:[.55*s,0,0],
    lCalf:[.1+.7*Math.max(0,-C(w)),0,0],rCalf:[.1+.7*Math.max(0,C(w)),0,0],
    lArm:[.45*s,0,0],rArm:[-.45*s,0,0],lFore:[-.25-.15*s,0,0],rFore:[-.25+.15*s,0,0],
    spine:[0,.07*s,0],hips:[0,-.07*s,.02*S(w*2)],head:[0,-.05*s,0],dy:.012*H*C(2*w)};}},
  run:{label:'Run',f:function(t,H){var w=2*PI/.62*t,s=S(w);return {
    lThigh:[-.95*s,0,0],rThigh:[.95*s,0,0],
    lCalf:[.2+1.25*Math.max(0,-C(w)),0,0],rCalf:[.2+1.25*Math.max(0,C(w)),0,0],
    lArm:[.9*s,0,.05],rArm:[-.9*s,0,-.05],lFore:[-1.2,0,0],rFore:[-1.2,0,0],
    spine:[.14,.12*s,0],hips:[0,-.1*s,0],head:[-.08,0,0],dy:.03*H*ABS(C(w))-.01*H};}},
  wave:{label:'Wave',dur:2.8,f:function(t,H){var up=Math.min(1,t/.35)*Math.min(1,(2.8-t)/.35);return {
    rArm:[0,0,-2.45*up],rFore:[-.2*up,0,(-.1+.55*S(t*9))*up],head:[0,-.15*up,.05*up],chest:[0,-.08*up,0]};}},
  dance:{label:'Dance',f:function(t,H){var w=2*PI*2*t;return {
    hips:[0,.18*S(w/2),.12*S(w)],spine:[0,-.15*S(w/2),-.06*S(w)],head:[.06*C(w),.1*S(w/2),0],
    lArm:[0,0,1.25+.55*S(w)],rArm:[0,0,-(1.25+.55*C(w))],lFore:[-.5,0,0],rFore:[-.5,0,0],
    lThigh:[-.3*Math.max(0,S(w)),0,.08],rThigh:[-.3*Math.max(0,-S(w)),0,-.08],
    lCalf:[.5*Math.max(0,S(w)),0,0],rCalf:[.5*Math.max(0,-S(w)),0,0],dy:-.012*H+.02*H*ABS(S(w))};}},
  celebrate:{label:'Celebrate',dur:2.4,f:function(t,H){var w=2*PI*2.2*t,g=Math.min(1,t/.2)*Math.min(1,(2.4-t)/.25);var j=ABS(S(w));return {
    lArm:[0,0,(2.7+.2*S(w*2))*g],rArm:[0,0,-(2.7+.2*S(w*2))*g],head:[-.2*g,0,0],spine:[-.08*g,0,0],
    lThigh:[-.6*j*g,0,0],rThigh:[-.6*j*g,0,0],lCalf:[.9*j*g,0,0],rCalf:[.9*j*g,0,0],dy:.05*H*j*g};}},
  sit:{label:'Sit',f:function(t,H){return {
    lThigh:[-1.52,0,.05],rThigh:[-1.52,0,-.05],lCalf:[1.5,0,0],rCalf:[1.5,0,0],lFoot:[-.05,0,0],rFoot:[-.05,0,0],
    lArm:[-.5,0,.1],rArm:[-.5,0,-.1],lFore:[-.7,0,0],rFore:[-.7,0,0],spine:[.04,0,0],dy:-.225*H};}},
  think:{label:'Think',f:function(t,H){return {
    rArm:[-.55,0,-.2],rFore:[-2.25,0,0],head:[.12,.18,.05],chest:[0,.05,0],lFore:[-.5,0,0],lArm:[-.25,0,.1]};}}
};
var curAnim='idle',animStart=0,time=0;
function play(n){curAnim=n;animStart=time;}

/* idle layer state */
var nextBlink=2,blinkT=-1,dbl=false,nextSac=1,gaze=[0,0],gazeT=[0,0];
var idleK=1,turntable=false;
function rnd(a,b){return a+Math.random()*(b-a);}

function tick(dt){
  time+=dt;
  var H=rig.H,B=rig.bones;
  var an=ANIMS[curAnim],local=time-animStart;
  if(an.dur&&local>an.dur){curAnim='idle';animStart=time;an=ANIMS.idle;local=0;highlightAnim();}
  var tg=an.f(local,H),k=1-Math.exp(-dt*10);
  for(var key in REST){
    var t=tg[key],r=REST[key];
    for(var i=0;i<3;i++){cur[key][i]+=(r[i]+(t?t[i]:0)-cur[key][i])*k;}
  }
  cur.dy+=((tg.dy||0)-cur.dy)*k;

  /* additive "alive" layer */
  var off={};function add(key,x,y,z){var o=off[key]||(off[key]=[0,0,0]);o[0]+=x;o[1]+=y;o[2]+=z;}
  var m=idleK,ph=(time/4.2)%1;
  var inh=ph<.4?S(ph/.4*PI/2):C((ph-.4)/.6*PI/2),br=inh*m;
  add('chest',-.03*br,0,0);add('spine',-.012*br,0,0);add('neck',.01*br,0,0);
  add('lArm',0,0,.014*br);add('rArm',0,0,-.014*br);
  var sh=S(time*.32)*m;
  add('hips',0,.01*sh,.016*sh);add('spine',0,-.006*sh,-.012*sh);
  var hx=(S(time*.53)*.02+S(time*1.3)*.006)*m,hy=(S(time*.37)*.04+S(time*.91)*.018)*m,hz=S(time*.41+1.3)*.012*m;
  add('head',hx,hy,hz);add('neck',hx*.4,hy*.4,hz*.4);

  nextBlink-=dt;
  if(nextBlink<=0&&blinkT<0){blinkT=0;dbl=Math.random()<.15;}
  var blink=0;
  if(blinkT>=0){blinkT+=dt;blink=S(Math.min(blinkT/.17,1)*PI);if(blinkT>=.17){blinkT=-1;nextBlink=dbl?.12:rnd(2,5.5);dbl=false;}}
  nextSac-=dt;
  if(nextSac<=0){gazeT=[rnd(-.18,.18),rnd(-.08,.1)];nextSac=rnd(.8,3);}
  var gk=1-Math.exp(-dt*18);gaze[0]+=(gazeT[0]-gaze[0])*gk;gaze[1]+=(gazeT[1]-gaze[1])*gk;
  add('lEye',gaze[1]*m,gaze[0]*m,0);add('rEye',gaze[1]*m,gaze[0]*m,0);

  for(var key2 in REST){
    var o=off[key2]||[0,0,0];
    B[key2].rotation.set(cur[key2][0]+o[0],cur[key2][1]+o[1],cur[key2][2]+o[2]);
  }
  B.hips.position.y=rig.hipsY+cur.dy;
  B.lEye.scale.y=B.rEye.scale.y=1-.92*blink;
  rig.torso.scale.set(1+.012*br,1+.006*br,1+.02*br);
  rig.chair.visible=cur.dy<-.05*H;
}

    ptrs[e.pointerId]=[e.clientX,e.clientY];
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastPinch)zoom=Math.max(.45,Math.min(2,zoom*(lastPinch/d)));
    lastPinch=d;return;
  }
  rotVel=(e.clientX-p[0])*.012;rotY+=rotVel;p[0]=e.clientX;p[1]=e.clientY;
});
function up(e){delete ptrs[e.pointerId];lastPinch=0;if(!Object.keys(ptrs).length)dragging=false;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.max(.45,Math.min(2,zoom*(1+e.deltaY*.001)));},{passive:false});

var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,.05);last=now;
  if(!dragging){rotVel*=.92;rotY+=rotVel;if(turntable)rotY+=dt*.5;}
  rig.root.rotation.y=rotY;
  tick(dt);
  var t=camTarget(),kk=1-Math.exp(-dt*6);
  camPos.lerp(t.pos,kk);camLook.lerp(t.look,kk);
  cam.position.copy(camPos);cam.lookAt(camLook);
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}

/* ================= UI ================= */
var tabsEl=document.getElementById('tabs'),panel=document.getElementById('panel');
var TAB_LIST=['Body','Face','Hair','Clothes','Extras','Moves','Save'];
var tab='Body';
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function grp(title){var g=el('div','grp');g.append(el('h3','',title));return g;}
var saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){try{localStorage.setItem('rws-character',JSON.stringify(state));}catch(e){}},300);}
function set(patch,rerender){Object.assign(state,patch);build();persist();if(rerender!==false)renderPanel();syncHeader();}

function chips(title,list,key){
  var g=grp(title),w=el('div','chips');
  list.forEach(function(o){var b=el('button','chip'+(state[key]===o[0]?' on':''),o[1]);b.onclick=function(){var p={};p[key]=o[0];set(p);};w.append(b);});
  g.append(w);return g;
}
function swatches(title,cols,key,custom){
  var g=grp(title),w=el('div','sw');
  cols.forEach(function(c){var b=el('button',state[key]===c?'on':'');b.style.background=c;b.setAttribute('aria-label','Colour '+c);b.onclick=function(){var p={};p[key]=c;set(p);};w.append(b);});
  if(custom){var i=document.createElement('input');i.type='color';i.value=state[key];i.id='custom-'+key;i.setAttribute('aria-label','Custom colour');
    i.oninput=function(){var p={};p[key]=i.value;set(p,false);};i.onchange=function(){renderPanel();};w.append(i);}
  g.append(w);return g;
}
function slider(label,key,id){
  var r=el('div','row'),l=el('label','',label);l.htmlFor=id;
  var i=document.createElement('input');i.type='range';i.min=0;i.max=1;i.step=.01;i.value=state[key];i.id=id;
  i.oninput=function(){var p={};p[key]=parseFloat(i.value);if(key==='build'){var v=p[key];p.bodyType=v<.2?'slim':v<.52?'stocky':v<.84?'big':'fat';}set(p,false);};
  r.append(l,i);return r;
}
function toggle(title,key,label){
  var g=grp(title),b=el('button','chip'+(state[key]?' on':''),label);
  b.onclick=function(){var p={};p[key]=!state[key];set(p);};g.append(b);return g;
}

function renderPanel(){
  var sy=panel.scrollTop;panel.replaceChildren();
  if(tab==='Body'){
    var g=grp('Body type'),types=el('div','chips');
    [['slim','Slim',.05],['stocky','Stocky',.34],['big','Big',.68],['fat','Fat',.98]].forEach(function(o){
      var b=el('button','chip'+(state.bodyType===o[0]?' on':''),o[1]);
      b.onclick=function(){set({bodyType:o[0],build:o[2]});};
      types.append(b);
    });
    g.append(types);
    var p=grp('Proportions');p.append(slider('Height','height','s-height'),slider('Build','build','s-build'));panel.append(g,p);
    panel.append(swatches('Skin tone',SKIN,'skin'),toggle('Natural detail','freckles','Freckles'));
  }else if(tab==='Face'){
    var f=grp('Face shape');f.append(slider('Face width','face','s-face'),slider('Nose size','nose','s-nose'));panel.append(f);
    panel.append(swatches('Eye colour',EYE_COL,'eye'),chips('Eyebrows',BROWS,'brow'),chips('Facial hair',FACIAL,'facial'));
  }else if(tab==='Hair'){
    panel.append(chips('Hairstyle',HAIRS,'hair'),swatches('Hair colour',HAIR_COL,'hairCol',true));
  }else if(tab==='Clothes'){
    panel.append(chips('Top',TOPS,'top'),swatches('Top colour',TOP_COL,'topCol',true));
    if(state.top==='dress'){var n=el('p','note','The sundress replaces your bottoms.');panel.append(n);}
    else{panel.append(chips('Bottoms',BOTTOMS,'bottom'),swatches('Bottoms colour',BOT_COL,'bottomCol',true));}
    panel.append(chips('Shoes',SHOES,'shoe'),swatches('Shoe colour',SHOE_COL,'shoeCol',true));
  }else if(tab==='Extras'){
    var a=grp('Accessories'),w=el('div','chips');
    ACCS.forEach(function(o){
      var b=el('button','chip'+(state.acc[o[0]]?' on':''),o[1]);
      b.onclick=function(){var acc=Object.assign({},state.acc);acc[o[0]]=!acc[o[0]];if(acc[o[0]]&&ACC_CONFLICT[o[0]])acc[ACC_CONFLICT[o[0]]]=false;set({acc:acc});};
      w.append(b);
    });
    a.append(w);panel.append(a,swatches('Accessory colour',ACC_COL,'accCol',true));
    panel.append(el('p','note','Colour applies to frames, hats, headphones, scarf, watch strap and backpack.'));
  }else if(tab==='Moves'){
    var m=grp('Animations'),w2=el('div','anims');
    Object.keys(ANIMS).forEach(function(k){var b=el('button','chip'+(curAnim===k?' on':''),ANIMS[k].label);b.dataset.anim=k;b.onclick=function(){play(k);highlightAnim();};w2.append(b);});
    m.append(w2);panel.append(m);
    var l=grp('Life');
    var r1=el('div','row'),lab=el('label','','Idle motion');lab.htmlFor='s-idle';
    var sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=2;sl.step=.05;sl.value=idleK;sl.id='s-idle';sl.oninput=function(){idleK=parseFloat(sl.value);};
    r1.append(lab,sl);l.append(r1);
    var tb=el('button','chip'+(turntable?' on':''),'Turntable');tb.onclick=function(){turntable=!turntable;tb.classList.toggle('on',turntable);};
    l.append(tb);panel.append(l);
  }else if(tab==='Save'){
    var s=grp('Name');var inp=document.createElement('input');inp.type='text';inp.id='char-name';inp.placeholder='Enter your name...';inp.maxLength=24;inp.value=state.name;
    inp.oninput=function(){state.name=inp.value;persist();};s.append(inp);panel.append(s);
    var loc=grp('Starting location'),locationSelect=document.createElement('select');
    locationSelect.id='reality-location';
    [['Kampala, Uganda','Kampala, Uganda'],['Entebbe, Uganda','Entebbe, Uganda'],['Jinja, Uganda','Jinja, Uganda'],['Mbarara, Uganda','Mbarara, Uganda'],['Nairobi, Kenya','Nairobi, Kenya'],['London, United Kingdom','London, United Kingdom']].forEach(function(o){var option=document.createElement('option');option.value=o[0];option.textContent=o[1];locationSelect.append(option);});
    locationSelect.value=state.location||'Kampala, Uganda';locationSelect.onchange=function(){state.location=locationSelect.value;persist();};loc.append(locationSelect);panel.append(loc);
    var start=el('button','chip','Save character & start life');
    start.style.cssText='width:100%;margin:12px 0;background:linear-gradient(120deg,#f5d487,#d5a746);color:#211b13;font-weight:800;padding:13px;border:0';
    start.onclick=function(){
      var player={name:(state.name||'Player').trim(),gender:state.gender,age:18,location:locationSelect.value,
        bodyType:state.bodyType||'stocky',height:state.height,build:state.build,skin:state.skin,hair:state.hair,hairColour:state.hairCol,
        eye:state.eye,top:state.top,topColour:state.topCol,bottom:state.bottom,bottomColour:state.bottomCol,shoe:state.shoe,
        cash:250000,health:100,level:1,createdAt:new Date().toISOString()};
      try{localStorage.setItem('rws-character',JSON.stringify(state));localStorage.setItem('realityPlayer',JSON.stringify(player));localStorage.setItem('realityProCharacter',JSON.stringify(state));}
      catch(e){alert('Could not save this character in this browser.');return;}
      location.href='home.html';
    };
    panel.append(start);
    var c=grp('Character code'),ta=document.createElement('textarea');ta.id='code';ta.value=JSON.stringify(state);ta.setAttribute('aria-label','Character code');
    var bw2=el('div','chips');
    var copy=el('button','chip','Copy code');
    copy.onclick=function(){ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){copy.textContent='Copied';},function(){copy.textContent='Select and copy';});}catch(e){copy.textContent='Select and copy';}};
    var load=el('button','chip','Load code');
    load.onclick=function(){try{var o=JSON.parse(ta.value);state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o);build();persist();renderPanel();syncHeader();}catch(e){load.textContent='Invalid code';}};
    var reset=el('button','chip','Reset');reset.onclick=function(){state=JSON.parse(JSON.stringify(DEFAULT));build();persist();renderPanel();syncHeader();};
    bw2.append(copy,load,reset);c.append(ta,bw2);
    c.append(el('p','note','Paste a code and press Load to bring a character back. Your latest character is also kept in this browser.'));
    panel.append(c);
  }
  panel.scrollTop=sy;
}
function highlightAnim(){panel.querySelectorAll('[data-anim]').forEach(function(b){b.classList.toggle('on',b.dataset.anim===curAnim);});}
function renderTabs(){
  tabsEl.replaceChildren();
  TAB_LIST.forEach(function(t){var b=el('button',t===tab?'on':'',t);b.onclick=function(){tab=t;renderTabs();renderPanel();};tabsEl.append(b);});
}
function syncHeader(){document.querySelectorAll('#gender button').forEach(function(b){b.classList.toggle('on',b.dataset.g===state.gender);});}

document.querySelectorAll('#gender button').forEach(function(b){b.onclick=function(){set({gender:b.dataset.g});play('wave');};});
document.getElementById('dice').onclick=function(){
  var acc={},opts=['glasses','shades','cap','beanie','headphones','earrings','necklace','scarf','watch','backpack'];
  opts.forEach(function(a){if(Math.random()<.22)acc[a]=true;});
  Object.keys(ACC_CONFLICT).forEach(function(a){if(acc[a]&&acc[ACC_CONFLICT[a]])acc[ACC_CONFLICT[a]]=false;});
  var g=state.gender;
  set({height:Math.random(),build:Math.random(),face:Math.random(),nose:Math.random(),skin:pick(SKIN),eye:pick(EYE_COL),brow:pick(BROWS)[0],
    freckles:Math.random()<.3,facial:g==='male'&&Math.random()<.5?pick(FACIAL)[0]:'none',hair:pick(HAIRS)[0],hairCol:pick(HAIR_COL),
    top:pick(TOPS)[0],topCol:pick(TOP_COL),bottom:pick(BOTTOMS)[0],bottomCol:pick(BOT_COL),shoe:pick(SHOES)[0],shoeCol:pick(SHOE_COL),acc:acc,accCol:pick(ACC_COL)});
  play('wave');
};
var viewBtn=document.getElementById('view');
viewBtn.onclick=function(){view=view==='full'?'half':view==='half'?'face':'full';zoom=1;viewBtn.textContent='View: '+VIEWS[view].label;};

/* ================= START ================= */
try{var saved=JSON.parse(localStorage.getItem('rws-character')||'null');if(saved&&saved.gender)state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),saved);}catch(e){}
build();resize();renderTabs();renderPanel();syncHeader();
var t0=camTarget();camPos.copy(t0.pos);camLook.copy(t0.look);
requestAnimationFrame(loop);
})();
</script>
